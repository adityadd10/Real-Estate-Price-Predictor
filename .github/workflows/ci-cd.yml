name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v --cov=src --cov=api --cov-report=term-missing

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image names
        # GHCR (like all Docker registries) requires lowercase repository paths.
        # github.repository preserves the repo's actual case (e.g.
        # "adityadd10/Real-Estate-Price-Predictor"), which Docker rejects --
        # GitHub Actions expressions have no built-in toLower(), so compute it
        # in bash instead of hardcoding it, in case the repo is ever renamed.
        id: vars
        run: |
          echo "image_api=${REGISTRY}/$(echo '${{ github.repository }}/api' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_streamlit=${REGISTRY}/$(echo '${{ github.repository }}/streamlit' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.vars.outputs.image_api }}:${{ github.sha }}
            ${{ steps.vars.outputs.image_api }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.streamlit
          push: true
          tags: |
            ${{ steps.vars.outputs.image_streamlit }}:${{ github.sha }}
            ${{ steps.vars.outputs.image_streamlit }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Render (see README) is connected directly to this repo's `main` branch and
  # rebuilds/deploys both services itself once this workflow's checks pass —
  # no deploy step needed here. If you swap Render for a host that needs a
  # push-to-deploy trigger, add a `curl "$RENDER_DEPLOY_HOOK_URL"` step here,
  # reading the hook URL from a repo secret.
