name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/api
  IMAGE_STREAMLIT: ${{ github.repository }}/streamlit

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v --cov=src --cov=api --cov-report=term-missing

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.streamlit
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_STREAMLIT }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_STREAMLIT }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Render (see README) is connected directly to this repo's `main` branch and
  # rebuilds/deploys both services itself once this workflow's checks pass —
  # no deploy step needed here. If you swap Render for a host that needs a
  # push-to-deploy trigger, add a `curl "$RENDER_DEPLOY_HOOK_URL"` step here,
  # reading the hook URL from a repo secret.
